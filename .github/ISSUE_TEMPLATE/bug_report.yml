name: Bug report
description: Something is broken or behaves differently than documented.
title: "[bug] "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include tokens, private IPs, or message contents. For security
        issues, use the private vulnerability reporting link instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Steps to reproduce, expected behavior, actual behavior.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or b89edf0
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Linux
        - Windows
        - macOS
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove tokens, message bodies, and personal paths.
      render: shell
    validations:
      required: false
