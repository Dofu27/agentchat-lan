name: release-notes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-v03027:
    if: contains(github.event.head_commit.message, '[release-notes]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update v0.30.27 release body
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit v0.30.27 --draft=false --notes-file docs/RELEASE_NOTES_v0.30.27.md
