name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)"
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race ./...

  test-windows:
    name: test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  installer-windows:
    name: installer (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build self-contained installer
        shell: bash
        run: VERSION=ci bash scripts/build-desktop-installer.sh
      - name: install, assert startup, uninstall
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/AgentChatConsole-ci-installer.exe"
          target="$RUNNER_TEMP/AgentChatCI"
          rm -rf "$target"
          "$exe" -no-launch -install-dir "$target" -role hub
          test -f "$target/AgentChatConsole.exe"
          test -f "$target/agentchat.exe"
          test -f "$target/.agentchat-install.json"
          startup="$APPDATA/Microsoft/Windows/Start Menu/Programs/Startup/AgentChat Console.lnk"
          test -f "$startup" || { echo "startup shortcut missing"; exit 1; }
          "$exe" -uninstall -remove-data -install-dir "$target"
          test ! -e "$target"
          test ! -e "$startup"

  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {goos: linux, goarch: amd64, ext: ""}
          - {goos: linux, goarch: arm64, ext: ""}
          - {goos: windows, goarch: amd64, ext: ".exe"}
          - {goos: darwin, goarch: amd64, ext: ""}
          - {goos: darwin, goarch: arm64, ext: ""}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=ci" \
            -o "dist/agentchat-${GOOS}-${GOARCH}${EXT}" ./cmd/agentchat
