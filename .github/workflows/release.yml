name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build self-contained desktop installer
        run: VERSION="${GITHUB_REF_NAME}" bash scripts/build-desktop-installer.sh

      - name: Build Linux/macOS launcher packages
        run: VERSION="${GITHUB_REF_NAME}" bash scripts/package-launcher.sh "${GITHUB_REF_NAME}" dist/launcher

      - name: Upload desktop assets and complete checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd dist && sha256sum "AgentChatConsole-${GITHUB_REF_NAME}-installer.exe") >> dist/checksums.txt
          (cd dist/launcher && sha256sum *.tar.gz) >> dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" \
            "dist/AgentChatConsole-${GITHUB_REF_NAME}-installer.exe" \
            dist/launcher/*.tar.gz \
            dist/checksums.txt --clobber
