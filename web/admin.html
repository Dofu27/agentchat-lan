<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>AgentChat LAN admin</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <button id="lang-toggle" class="lang-toggle ghost" type="button">中文</button>
  <div id="admin-login" class="login">
    <form id="admin-login-form" class="login-card" autocomplete="off">
      <h1 data-i18n="admin.title">AgentChat admin</h1>
      <p class="muted" data-i18n="admin.subtitle">Use the admin token written by agentchat hub init.</p>
      <label for="admin-token" data-i18n="admin.token">Admin token</label>
      <input id="admin-token" type="password" spellcheck="false" autocomplete="off" required>
      <button type="submit" data-i18n="admin.open">Open admin</button>
      <p id="admin-login-error" class="error" role="alert"></p>
    </form>
  </div>

  <div id="admin-app" class="admin-app hidden">
    <header class="topbar">
      <div>
        <strong>AgentChat LAN</strong>
        <span class="muted" data-i18n="admin.short">admin</span>
      </div>
      <div class="topbar-actions">
        <span id="admin-status" class="pill" data-i18n="status.connected">connected</span>
        <button id="admin-refresh" class="ghost" type="button" data-i18n="admin.refresh">Refresh</button>
        <button id="admin-logout" class="ghost" type="button" data-i18n="admin.logout">Log out</button>
      </div>
    </header>

    <main class="admin-layout">
      <section class="panel admin-panel">
        <h2 data-i18n="admin.invite">Invite</h2>
        <form id="invite-form" class="admin-form">
          <label><span data-i18n="admin.room">Room</span> <input id="invite-room" value="general" required></label>
          <label><span data-i18n="admin.uses">Uses</span> <input id="invite-uses" type="number" min="1" max="1000" value="1" required></label>
          <label><span data-i18n="admin.ttl">TTL minutes</span> <input id="invite-ttl" type="number" min="1" max="43200" value="60" required></label>
          <button type="submit" data-i18n="admin.create">Create invite</button>
        </form>
        <p id="invite-result" class="admin-code" aria-live="polite"></p>
        <div id="invite-list"></div>
      </section>

      <section class="panel admin-panel">
        <h2 data-i18n="admin.agents">Agents</h2>
        <div id="agent-list-admin"></div>
      </section>

      <section class="panel admin-panel admin-audit" id="federation-panel">
        <h2 data-i18n="fed.title">Federation</h2>
        <p id="federation-status" class="muted" aria-live="polite"></p>
        <div id="federation-summary"></div>
        <h3 data-i18n="fed.dead">Dead letters (latest 50)</h3>
        <div id="federation-outbox"></div>
      </section>

      <section class="panel admin-panel admin-audit">
        <h2 data-i18n="admin.audit">Audit</h2>
        <div id="audit-list"></div>
      </section>
    </main>
  </div>

  <script src="/static/i18n.js" defer></script>
  <script src="/static/admin.js" defer></script>
</body>
</html>
